name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      verbose:
        description: "Gradle --info --stacktrace"
        type: boolean
        default: false

env:
  GRADLE_FLAGS: ${{ inputs.verbose && '--info --stacktrace' || '--warning-mode=summary' }}

jobs:
  compile:
    runs-on: android
    steps:
      - name: Toolchain
        run: |
          echo "image      : $ImageOS $ImageVersion"
          echo "java       : $(java -version 2>&1 | head -1)"
          echo "sdk        : $ANDROID_SDK_ROOT"
          echo "ndk        : $(ls $ANDROID_SDK_ROOT/ndk 2>/dev/null | tr '\n' ' ')"
          echo "cmake      : $(ls $ANDROID_SDK_ROOT/cmake 2>/dev/null | tr '\n' ' ')"
          echo "platforms  : $(ls $ANDROID_SDK_ROOT/platforms 2>/dev/null | tr '\n' ' ')"
          echo "node       : $(node --version)"
          echo "cpus/mem   : $(nproc) / $(free -h | awk '/Mem:/{print $2}')"
          df -h . | tail -1

      - uses: actions/checkout@v4

      # Only jlatexmath is needed to configure Gradle; the native submodules are
      # not, and they are the expensive ones.
      - name: Fetch build-time submodule
        run: git submodule update --init --depth 1 TMessagesProj/lib/jlatexmath

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Configure
        env:
          APP_ID: ${{ secrets.CHERRYGRAM_APP_ID }}
          APP_HASH: ${{ secrets.CHERRYGRAM_APP_HASH }}
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            [ -n "$APP_ID" ] && echo "CHERRYGRAM_APP_ID=$APP_ID"
            [ -n "$APP_HASH" ] && echo "CHERRYGRAM_APP_HASH=$APP_HASH"
          } > local.properties

      - name: Compile
        run: |
          ./gradlew --no-daemon --console=plain $GRADLE_FLAGS \
            :TMessagesProj:compileDebugJavaWithJavac \
            :TMessagesProj_App:compileAfatDebugJavaWithJavac \
            :TMessagesProj_AppStandalone:compileAfatDebugJavaWithJavac

  apk:
    runs-on: android
    needs: compile
    if: github.event_name == 'workflow_dispatch'
    steps:
      # The native build needs every submodule: some are compiled, others are
      # only included from, such as openh264's headers in the WebRTC code.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Configure
        env:
          APP_ID: ${{ secrets.CHERRYGRAM_APP_ID }}
          APP_HASH: ${{ secrets.CHERRYGRAM_APP_HASH }}
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            [ -n "$APP_ID" ] && echo "CHERRYGRAM_APP_ID=$APP_ID"
            [ -n "$APP_HASH" ] && echo "CHERRYGRAM_APP_HASH=$APP_HASH"
          } > local.properties

      # A stable keystore keeps every runner-produced APK upgrade-compatible;
      # without it AGP regenerates a debug key per container and each build
      # would be signed by a different identity.
      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      # Cloud Messaging only; the crashlytics plugin is not applied and Remote
      # Config is never initialised, so this file only enables push.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > TMessagesProj_App/google-services.json
            cp TMessagesProj_App/google-services.json TMessagesProj_AppStandalone/
            echo "push enabled for this build"
          else
            echo "no GOOGLE_SERVICES_JSON; building without push"
          fi

      - name: Assemble debug APK
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ARGS=""
          if [ -n "${{ steps.keystore.outputs.path }}" ]; then
            ARGS="-PRELEASE_STORE_FILE=${{ steps.keystore.outputs.path }} \
                  -PRELEASE_STORE_PASSWORD=$STORE_PASSWORD \
                  -PRELEASE_KEY_ALIAS=$KEY_ALIAS \
                  -PRELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          fi
          ./gradlew --no-daemon --console=plain $GRADLE_FLAGS $ARGS :TMessagesProj_App:assembleAfatDebug

      - name: Report signer
        run: |
          APK=$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -1)
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK" \
            | grep -E 'certificate DN|certificate SHA-256' || true

      - uses: actions/upload-artifact@v4
        with:
          name: cherrygram-next-debug
          path: TMessagesProj_App/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Free build intermediates
        if: always()
        run: rm -rf TMessagesProj/.cxx TMessagesProj/build TMessagesProj_App/build TMessagesProj_AppStandalone/build
