name: Build

# Forgejo reads .forgejo/workflows when that directory exists, so nothing here
# runs on the mirror.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK, CMake and ccache
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;27.2.12479018' 'cmake;3.22.1' >/dev/null
          sudo apt-get install -y ccache >/dev/null

      - name: Native compiler cache key
        id: ccache-key
        run: |
          { git submodule status | awk '{print $1, $2}'; \
            find TMessagesProj/jni -name 'CMakeLists.txt' -exec sha256sum {} +; \
          } | sha256sum | cut -c1-16 | sed 's/^/key=/' >> "$GITHUB_OUTPUT"

      # Shared with the release job, which builds the same objects for this abi.
      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ steps.ccache-key.outputs.key }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          ccache --set-config max_size=3G
          ccache --set-config hash_dir=false
          ccache --set-config compiler_check=content
          ccache --zero-stats

      - name: Configure
        env:
          APP_ID: ${{ secrets.HACHIGRAM_APP_ID }}
          APP_HASH: ${{ secrets.HACHIGRAM_APP_HASH }}
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            [ -n "$APP_ID" ] && echo "HACHIGRAM_APP_ID=$APP_ID"
            [ -n "$APP_HASH" ] && echo "HACHIGRAM_APP_HASH=$APP_HASH"
          } > local.properties

      # Signed with the release key when the secret is available (pushes to this
      # repo), so the artifact installs over a released build for testing. Pull
      # requests and forks get no secrets and fall back to the debug key.
      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
            echo "signing with the release key"
          else
            echo "no KEYSTORE_BASE64; signing with the debug key"
          fi

      # One abi only. Every device worth smoke testing on is arm64, and building
      # the second one doubles the slowest part of the job for nobody.
      - name: Assemble debug apk
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          SIGNING=()
          if [ -n "$KEYSTORE_PATH" ]; then
            SIGNING=(
              "-PRELEASE_STORE_FILE=$KEYSTORE_PATH"
              "-PRELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              "-PRELEASE_KEY_ALIAS=$KEY_ALIAS"
              "-PRELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            )
          fi
          ./gradlew --no-daemon --console=plain --warning-mode=summary \
            -PNATIVE_CCACHE=true \
            -PSINGLE_ABI=arm64-v8a \
            "${SIGNING[@]}" \
            :TMessagesProj_AppStandalone:assembleAfatDebug

      - name: Print signature
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          for apk in TMessagesProj_AppStandalone/build/outputs/apk/**/debug/*.apk; do
            echo "== $apk"
            "$BT/apksigner" verify --print-certs "$apk" | grep -E 'certificate DN|certificate SHA-256'
          done

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - uses: actions/upload-artifact@v4
        with:
          name: hachigram-debug-arm64-${{ github.sha }}
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
