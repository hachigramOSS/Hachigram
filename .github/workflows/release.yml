name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install NDK and CMake
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            'ndk;27.2.12479018' 'cmake;3.22.1' >/dev/null

      - name: Release metadata
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Fails if VERSION, the tag and APP_VERSION_NAME_CHERRY disagree.
          META=$(python3 scripts/release_meta.py "$TAG" --notes-out "$RUNNER_TEMP/notes.md")
          echo "$META"
          echo "name=$(echo "$META" | python3 -c 'import json,sys;print(json.load(sys.stdin)["name"])')" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(echo "$META" | python3 -c 'import json,sys;print(str(json.load(sys.stdin)["prerelease"]).lower())')" >> "$GITHUB_OUTPUT"

      - name: Restore keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set; a release must be signed." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Configure
        env:
          APP_ID: ${{ secrets.HACHIGRAM_APP_ID }}
          APP_HASH: ${{ secrets.HACHIGRAM_APP_HASH }}
        run: |
          {
            echo "sdk.dir=$ANDROID_SDK_ROOT"
            [ -n "$APP_ID" ] && echo "HACHIGRAM_APP_ID=$APP_ID"
            [ -n "$APP_HASH" ] && echo "HACHIGRAM_APP_HASH=$APP_HASH"
          } > local.properties

      # Cloud Messaging only; the crashlytics plugin is not applied and Remote
      # Config is never initialised, so this file only enables push.
      - name: Restore Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > TMessagesProj_App/google-services.json
            cp TMessagesProj_App/google-services.json TMessagesProj_AppStandalone/
            echo "push enabled for this build"
          else
            echo "no GOOGLE_SERVICES_JSON; building without push"
          fi

      - name: Assemble
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --console=plain --warning-mode=summary \
            -PRELEASE_STORE_FILE=${{ steps.keystore.outputs.path }} \
            -PRELEASE_STORE_PASSWORD="$STORE_PASSWORD" \
            -PRELEASE_KEY_ALIAS="$KEY_ALIAS" \
            -PRELEASE_KEY_PASSWORD="$KEY_PASSWORD" \
            :TMessagesProj_AppStandalone:assembleAfatStandalone

      - name: Verify signature
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          for apk in $(find TMessagesProj_AppStandalone -name '*.apk'); do
            echo "== $apk"
            "$BT/apksigner" verify --print-certs "$apk" \
              | grep -E 'certificate DN|certificate SHA-256'
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FLAGS=""
          [ "${{ steps.meta.outputs.prerelease }}" = "true" ] && FLAGS="--prerelease"
          gh release create "${{ steps.meta.outputs.tag }}" $FLAGS \
            --title "${{ steps.meta.outputs.name }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            $(find TMessagesProj_AppStandalone -name '*.apk')
